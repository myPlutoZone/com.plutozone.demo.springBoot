# ----------------------------------------------------
# 1. Spring Boot
# ----------------------------------------------------
# server.port=8080
server.servlet.session.tracking-modes=cookie

# ----------------------------------------------------
# 1-1. For safe shutdown settings(Spring Boot 2.3.0 or higher)
# ----------------------------------------------------
# Default: server.shutdown=immediate
server.shutdown=graceful
# Default: spring.lifecycle.timeout-per-shutdown-phase=30s
spring.lifecycle.timeout-per-shutdown-phase=1m


# ----------------------------------------------------
# 2. Thymeleaf
# ----------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.check-template-location=false
spring.thymeleaf.suffix=.html
# spring.thymeleaf.mode=HTML5
spring.thymeleaf.cache=false
spring.thymeleaf.order=0


# ----------------------------------------------------
# 3. DB Connection
# ----------------------------------------------------
# 3-1. Initialization Mode
# spring.datasource.initialization-mode=always

# 3-2. Use Static Variable
spring.datasource.url=jdbc:mysql://172.16.0.1:3306/plutozone
spring.datasource.username=plutozone
spring.datasource.password=my1234!!

